<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك لتطبيق تيك توك...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>🔄 جاري تحويلك إلى التطبيق...</h2>
        <p id="status">الرجاء الانتظار قليلاً.</p>
    </div>

    <script>
        // التقاط الكود والبيانات القادمة من رابط تيك توك
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');

        if (code) {
            // توجيه المستخدم برابط التطبيق المخصص مع الكود
            const appDeepLink = `com.nejm.tiktok://oauth?code=${code}&state=${state || ''}`;
            document.getElementById('status').innerText = "تم استلام الكود، يتم فتح التطبيق الآن...";
            
            // فتح التطبيق فوراً
            window.location.href = appDeepLink;
        } else {
            document.getElementById('status').innerText = "⚠️ لم يتم العثور على كود التفعيل.";
        }
    </script>
</body>
</html>
